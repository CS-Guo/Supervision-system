name: supervision
services:
  db:
    image: supervision-mysql:8.0.45-amd64
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先运行 deploy.sh}
      MYSQL_DATABASE: supervision
      MYSQL_USER: supervision
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先运行 deploy.sh}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+08:00"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u supervision -D supervision -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  app:
    image: supervision-app:1.0.0-amd64
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_DSN: "supervision:${MYSQL_PASSWORD:?请先运行 deploy.sh}@tcp(db:3306)/supervision?parseTime=true&charset=utf8mb4&loc=Local"
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?请先运行 deploy.sh}
      TZ: Asia/Shanghai
      MAX_UPLOAD_MB: "20"
    ports:
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  mysql_data:
  uploads:
